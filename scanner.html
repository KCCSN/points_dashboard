<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Remote Control</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- SUPABASE JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* NEW VIBRANT ARCADE COLOR PALETTE */
        :root { 
            --dark: #10002B; 
            --surface: #FFFFFF; 
            --yellow: #FEE440; 
            --primary: #F15BB5; 
            --green: #00F5D4; 
            --orange: #FF9F1C; 
            --purple: #9D4EDD; 
            --bg: #00F5D4; /* Vibrant Cyan Body for Mobile */
        }
        
        body { 
            margin: 0; 
            font-family: 'Nunito', sans-serif; 
            background: var(--bg); 
            color: var(--dark); 
            text-align: center; 
            background-image: radial-gradient(var(--surface) 2px, transparent 2px); 
            background-size: 20px 20px;
            padding-bottom: 40px;
        }
        
        .fredoka { font-family: 'Fredoka', sans-serif; }
        
        header { 
            background: var(--purple); 
            color: white; 
            padding: 15px; 
            font-size: 1.6rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 5px solid var(--dark);
            text-shadow: 2px 2px 0 var(--dark);
        }
        
        #mainAppView { display: block; }
        #mobileVaultView { display: none; flex-direction: column; height: 100vh; overflow: hidden; background: var(--purple);}

        .remote-bar { padding: 10px 15px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn-remote { 
            border: 4px solid var(--dark); padding: 10px; font-size: 1rem; font-family: 'Nunito', sans-serif; font-weight: 800; border-radius: 10px; cursor: pointer; flex: 1; min-width: 75px; box-shadow: 4px 4px 0 var(--dark); transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-remote:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--dark); }
        
        .btn-vault { background: var(--yellow); color: var(--dark); } 
        .btn-reveal { background: var(--primary); color: white; } 
        .btn-fun { background: var(--orange); color: white; }
        .btn-admin { background: var(--surface); color: var(--dark); } 
        .btn-goal { background: #2196F3; color: white; }
        
        /* SECTION CARDS */
        .section-card { background: white; margin: 10px 15px; padding: 15px; border-radius: 12px; border: 4px solid var(--dark); box-shadow: 6px 6px 0 var(--dark); text-align: left; }
        .section-title { margin: 0 0 10px 0; font-size: 1.2rem; font-weight: 800; color: var(--dark); display: flex; justify-content: space-between; align-items: center; }

        /* TIMERS */
        .grid-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-mini { background: var(--yellow); border: 3px solid var(--dark); padding: 10px 12px; border-radius: 8px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer; box-shadow: 3px 3px 0 var(--dark); flex: 1; min-width: 65px; text-align: center; }
        .btn-mini:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--dark); }

        /* SEARCH BAR */
        .search-container { margin: 10px 15px; }
        .remote-search { width: 100%; padding: 15px; font-size: 1.2rem; font-family: 'Fredoka', sans-serif; font-weight: 800; border: 4px solid var(--dark); border-radius: 12px; box-shadow: 6px 6px 0 var(--dark); outline: none; box-sizing: border-box; text-align: center; }

        /* VISUAL ROSTER GRID */
        .roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; max-height: 400px; overflow-y: auto; padding: 5px; }
        .student-card { background: white; border: 4px solid var(--dark); border-radius: 12px; padding: 10px 5px; text-align: center; box-shadow: 4px 4px 0 var(--dark); cursor: pointer; position: relative; user-select: none; }
        .student-card.selected { background: var(--yellow); border-color: var(--primary); box-shadow: 4px 4px 0 var(--primary); }
        .student-card img { width: 50px; height: 50px; border-radius: 8px; border: 3px solid var(--dark); background: var(--bg); }
        .student-card h4 { margin: 5px 0 0 0; font-size: 1rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .student-card span { font-size: 0.9rem; font-weight: 800; color: var(--purple); }

        /* MULTI-SELECT BAR */
        #bulkActionBar { display: none; position: fixed; bottom: 15px; left: 15px; right: 15px; background: var(--dark); color: white; padding: 15px 20px; border-radius: 15px; border: 4px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.5); z-index: 9500; justify-content: space-between; align-items: center; }

        .auto-toggle { margin: 0 15px 10px 15px; padding: 15px; background: white; border-radius: 12px; border: 4px solid var(--dark); box-shadow: 6px 6px 0 var(--dark); cursor: pointer; }
        .auto-toggle h2 { margin: 0; font-size: 1.4rem; }
        .auto-on { background: var(--primary); color: white; }
        .double-on { background: var(--orange); color: white; }

        #actionPanel { display: none; background: white; margin: 15px; padding: 25px 20px; border-radius: 15px; position: relative; border: 5px solid var(--dark); box-shadow: 10px 10px 0 var(--dark); }
        #scanAvatar { width: 100px; height: 100px; border-radius: 12px; border: 5px solid var(--dark); background: var(--bg); box-shadow: 6px 6px 0 var(--dark); }
        .color-picker { position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; padding: 0; border: 4px solid var(--dark); border-radius: 8px; cursor: pointer; box-shadow: 3px 3px 0 var(--dark); }
        
        .tag-row { display: flex; gap: 8px; justify-content: center; margin-top: 15px; flex-wrap: wrap;}
        .tag-btn { background: white; border: 3px solid var(--dark); padding: 8px 12px; border-radius: 8px; font-family: 'Nunito', sans-serif; font-weight: 800; cursor: pointer; color: var(--dark); box-shadow: 3px 3px 0 var(--dark); }
        .tag-btn.active { background: var(--purple); color: white; }
        
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn { border: 4px solid var(--dark); padding: 15px 20px; font-size: 1.8rem; font-family: 'Fredoka', sans-serif; font-weight: 800; border-radius: 12px; cursor: pointer; color: white; flex: 1; box-shadow: 6px 6px 0 var(--dark); }
        .btn-1 { background: #4CAF50; } .btn-2 { background: #2196F3; }

        #undoToast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 15px 30px; border-radius: 12px; font-size: 1.2rem; font-weight: 800; box-shadow: 8px 8px 0 rgba(0,0,0,0.4); display: none; z-index: 9900; cursor: pointer; border: 4px solid var(--primary); }
        
        .btn-cancel { background: transparent; color: var(--dark); border: 4px solid var(--dark); padding: 12px; border-radius: 10px; font-size: 1.2rem; margin-top: 20px; width: 100%; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 800; box-shadow: 4px 4px 0 var(--dark); }
        
        .vault-list-container { flex: 1; overflow-y: auto; background: white; border-radius: 12px; border: 5px solid var(--dark); padding: 15px; display: flex; flex-direction: column; gap: 10px; margin: 15px; box-shadow: inset 3px 3px 0 rgba(0,0,0,0.1); }
        .vault-winner-card { background: var(--surface); color: var(--dark); border-radius: 10px; padding: 10px 15px; display: flex; align-items: center; gap: 15px; font-weight: 800; font-size: 1.3rem; border: 4px solid var(--dark); box-shadow: 4px 4px 0 var(--dark); cursor: pointer; }
        .vault-winner-card img { width: 50px; height: 50px; border-radius: 8px; border: 3px solid var(--dark); background: var(--bg); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(16, 0, 43, 0.9); display: none; align-items: center; justify-content: center; z-index: 10000; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--surface); padding: 30px; border-radius: 15px; max-width: 350px; width: 90%; text-align: center; position: relative; border: 6px solid var(--dark); box-shadow: 10px 10px 0 var(--yellow); }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 2.5rem; font-weight: 800; cursor: pointer; color: var(--dark); }
        .settings-input { width: 100%; padding: 12px; font-size: 1.2rem; border-radius: 10px; border: 4px solid var(--dark); margin-bottom: 15px; box-sizing: border-box; font-family: 'Nunito', sans-serif; font-weight: 800; box-shadow: inset 3px 3px 0 rgba(0,0,0,0.1); }
        .settings-label { text-align: left; display: block; font-weight: 800; color: var(--dark); margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="mainAppView">
        <header class="fredoka">
            📱 Teacher Dashboard 
            <button class="btn-remote btn-fun" style="max-width: 50px; border-color: white; box-shadow: none;" onclick="sendRealtimeCommand('partyConfetti')">🎉</button>
        </header>
        
        <div class="remote-bar">
            <button id="btnPauseScrollRemote" class="btn-remote" style="background:var(--surface); color:var(--dark);" onclick="toggleScrollRemote()">⏸️ Pause</button>
            <button class="btn-remote btn-vault" onclick="sendRealtimeCommand('showVault'); openPrizeVaultLocal();">🎁 Vault</button>
            <button class="btn-remote btn-reveal" onclick="sendRealtimeCommand('revealVault'); revealPrizeVaultLocal();">🏆 Reveal</button>
            <button id="doubleBtn" class="btn-remote" style="background:var(--dark); color:white; min-width: 100%; margin-top: 5px;" onclick="toggleDouble()">🔥 Enable x2 Points</button>
        </div>

        <!-- WHOLE CLASS & MULTI-SELECT ACTIONS -->
        <div class="remote-bar" style="padding-top: 0;">
            <button class="btn-remote" style="background: var(--purple); color: white;" onclick="awardClassPoint()">👥 Class +1</button>
            <button id="btnMultiSelect" class="btn-remote" style="background: var(--surface);" onclick="toggleMultiSelectMode()">☑️ Multi-Select</button>
        </div>

        <!-- TIMER CONTROLS -->
        <div class="section-card">
            <div class="section-title"><span>⏱️ Countdown Timer</span></div>
            <div class="grid-buttons">
                <button class="btn-mini" onclick="sendRealtimeCommand('startTimer', {duration: 60})">1 Min</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('startTimer', {duration: 120})">2 Min</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('startTimer', {duration: 300})">5 Min</button>
                <button class="btn-mini" onclick="sendRealtimeCommand('startTimer', {duration: 600})">10 Min</button>
                <button class="btn-mini" style="background: var(--primary); color: white;" onclick="sendRealtimeCommand('stopTimer')">⏹️ Clear</button>
            </div>
        </div>

        <!-- SEARCH BAR -->
        <div class="search-container">
            <input type="text" id="remoteSearchInput" class="remote-search" list="studentDatalist" placeholder="🔍 Search or tap student below..." onchange="handleRemoteSearch(this.value)">
            <datalist id="studentDatalist"></datalist>
        </div>

        <!-- VISUAL ROSTER GRID -->
        <div class="section-card" style="padding: 10px;">
            <div class="section-title"><span id="rosterHeaderTitle">📋 Student Roster</span></div>
            <div class="roster-grid" id="rosterGrid"></div>
        </div>

        <!-- SINGLE STUDENT ACTION PANEL -->
        <div id="actionPanel">
            <input type="color" id="avatarColor" class="color-picker" title="Change Avatar Color" onchange="updateAvatarColor(this.value)">
            <img id="scanAvatar" src="" alt="Student Avatar">
            <h2 id="scanName" class="fredoka" style="font-size: 2.5rem; margin: 10px 0 0 0; color: var(--dark);">Name</h2>
            <div style="font-size: 1.8rem; font-weight: 800; color: var(--primary);">⭐ <span id="scanPoints" class="fredoka">0</span></div>
            
            <div class="tag-row">
                <button class="tag-btn" onclick="toggleTag(this, 'Helping')">Helping</button>
                <button class="tag-btn" onclick="toggleTag(this, 'On Task')">On Task</button>
                <button class="tag-btn" onclick="toggleTag(this, 'Quiet')">Quiet</button>
            </div>

            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn-cancel" style="margin-top: 0; background: var(--yellow); color: var(--dark);" onclick="document.getElementById('artUpload').click()">📸 Add Art</button>
                <button class="btn-cancel" style="margin-top: 0; background: var(--green); color: var(--dark);" onclick="document.getElementById('avatarUpload').click()">📸 Avatar</button>
            </div>
            <input type="file" id="artUpload" accept="image/*" style="display:none" onchange="handleImageUpload(this, 'artwork')">
            <input type="file" id="avatarUpload" accept="image/*" capture="user" style="display:none" onchange="handleImageUpload(this, 'avatar')">

            <div class="btn-group">
                <button class="btn btn-1" onclick="submitPoints(1)">+1</button>
                <button class="btn btn-2" onclick="submitPoints(2)">+2</button>
            </div>

            <button class="btn-cancel" onclick="resetRemote()">Cancel / Back to Roster</button>
        </div>
    </div>

    <!-- BULK ACTION BAR -->
    <div id="bulkActionBar">
        <span id="bulkCountText" style="font-weight: 800; font-size: 1.2rem;">0 Selected</span>
        <div style="display: flex; gap: 5px;">
            <button class="btn-mini" style="background: var(--green); color: var(--dark);" onclick="submitBulkPoints(1)">+1 All</button>
            <button class="btn-mini" style="background: var(--primary); color: white;" onclick="submitBulkPoints(2)">+2 All</button>
            <button class="btn-mini" style="background: var(--surface);" onclick="clearMultiSelect()">Clear</button>
        </div>
    </div>

    <div id="undoToast" onclick="undoLastPoint()">↩️ Undo Last Point</div>

    <!-- VAULT VIEW -->
    <div id="mobileVaultView">
        <header style="background: var(--yellow); color: var(--dark);" class="fredoka">🎁 Prize Vault Control</header>
        <div id="vaultLockedState" style="flex:1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
            <h1 style="font-size: 6rem; margin:0; text-shadow: 4px 4px 0 var(--dark);">🔒</h1>
            <button class="btn-remote btn-reveal" style="padding: 20px; font-size: 2.5rem; width: 100%; margin-top: 30px; border-width: 6px;" onclick="sendRealtimeCommand('revealVault'); revealPrizeVaultLocal();">🎉 REVEAL</button>
        </div>
        <div id="vaultRevealedState" style="display: none; flex-direction: column; padding: 10px; flex: 1; min-height: 0;">
            <h2 style="color: var(--dark); margin-top: 10px; font-size: 2.5rem; background: var(--green); padding: 10px; border: 5px solid var(--dark); border-radius: 15px; box-shadow: 6px 6px 0 var(--dark);" class="fredoka">🏆 15-Pt Club</h2>
            <div id="mobileWinnerList" class="vault-list-container"></div>
        </div>
        <div style="padding: 20px;"><button class="btn-cancel" style="width: 100%; background: var(--surface); color: var(--dark); border-width: 5px; margin: 0; font-size: 1.5rem;" onclick="sendRealtimeCommand('closeVault'); closePrizeVaultLocal();">✖ Close Vault</button></div>
    </div>

    <!-- MODALS -->
    <div id="pinModal" class="modal-overlay">
        <!-- Kept functional but hidden behind Goal button -->
    </div>
    <div id="goalModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('goalModal').classList.remove('active')">&times;</span>
            <h2 style="margin-top: 0; color: var(--dark);" class="fredoka">🎯 Edit Class Goal</h2>
            <label class="settings-label">Goal Emoji:</label>
            <input type="text" id="goalEmojiInput" class="settings-input" value="🍕">
            <label class="settings-label">Goal Name:</label>
            <input type="text" id="goalNameInput" class="settings-input" value="Pizza Party">
            <label class="settings-label">Target Amount:</label>
            <input type="number" id="goalAmountInput" class="settings-input" value="500">
            <button type="button" class="btn-remote" style="background: var(--green); color: var(--dark); width: 100%; font-size: 1.5rem; margin-top: 10px; padding: 15px;" onclick="saveGoalSettings()">Broadcast Goal</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚀 SUPABASE CONFIGURATION - ADD KEYS HERE
        // ==========================================
        const SUPABASE_URL = "https://gwioehanutcohkyuoyks.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3aW9laGFudXRjb2hreXVveWtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MzE2MDcsImV4cCI6MjEwNzQwNzYwN30.NU3o5jnAV6D6y7dE054EqwbPtaDwNRaSj3DznJOp-lU";
        
        
        // RENAMED TO dbClient to prevent CDN script collision
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const room = dbClient.channel('classroom');

        let students = []; 
        let activeStudentName = 'none'; 
        let isAutoMode = 'off'; 
        let isDouble = false; 
        let isMultiSelectMode = false;
        let selectedStudentsSet = new Set();
        let selectedTag = "None"; 
        let undoData = null; 
        let undoTimer = null;
        let isScrollPaused = false;

        function showToast(msg, isSuccess = false) {
            const toast = document.getElementById('undoToast');
            if (!toast) return;
            toast.style.background = isSuccess ? 'var(--green)' : 'var(--primary)';
            toast.style.color = isSuccess ? 'var(--dark)' : 'white';
            toast.innerHTML = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function getSafeAvatar(studentName, url) {
            const safeName = studentName ? encodeURIComponent(studentName.trim()) : 'Student';
            const strUrl = url ? url.toString().trim() : "";
            if (!strUrl || !strUrl.startsWith("http") || strUrl.includes("github.io")) {
                return `https://api.dicebear.com/9.x/bottts/svg?seed=${safeName}`;
            }
            return strUrl;
        }

        function sendRealtimeCommand(action, extras = {}) { 
            room.send({
                type: 'broadcast',
                event: 'command',
                payload: { action: action, ...extras }
            }).catch(err => {
                console.error("Broadcast failed:", err);
                showToast("⚠️ Signal lost. Check connection.");
            });
        }

        // RENDER VISUAL STUDENT ROSTER
        function renderRosterGrid() {
            const grid = document.getElementById('rosterGrid');
            if (!grid) return;
            grid.innerHTML = '';

            students.forEach(s => {
                const isSelected = selectedStudentsSet.has(s.Name);
                const card = document.createElement('div');
                card.className = `student-card ${isSelected ? 'selected' : ''}`;
                card.onclick = () => handleStudentCardClick(s);

                card.innerHTML = `
                    <img src="${getSafeAvatar(s.Name, s.AvatarURL)}" alt="Avatar">
                    <h4 class="fredoka">${s.Name}</h4>
                    <span>⭐ ${s.Points}</span>
                `;
                grid.appendChild(card);
            });
        }

        function handleStudentCardClick(student) {
            if (isMultiSelectMode) {
                if (selectedStudentsSet.has(student.Name)) {
                    selectedStudentsSet.delete(student.Name);
                } else {
                    selectedStudentsSet.add(student.Name);
                }
                updateBulkBarUI();
                renderRosterGrid();
            } else {
                activeStudentName = student.Name;
                sendRealtimeCommand('setActive', { name: student.Name });
                showActionPanel(student);
            }
        }

        // MULTI-SELECT & WHOLE CLASS LOGIC
        function toggleMultiSelectMode() {
            isMultiSelectMode = !isMultiSelectMode;
            const btn = document.getElementById('btnMultiSelect');
            const title = document.getElementById('rosterHeaderTitle');
            
            if (isMultiSelectMode) {
                btn.style.background = 'var(--yellow)';
                title.textContent = "☑️ Select Students below...";
                document.getElementById('bulkActionBar').style.display = 'flex';
            } else {
                clearMultiSelect();
            }
        }

        function clearMultiSelect() {
            isMultiSelectMode = false;
            selectedStudentsSet.clear();
            document.getElementById('btnMultiSelect').style.background = 'var(--surface)';
            document.getElementById('rosterHeaderTitle').textContent = "📋 Student Roster";
            document.getElementById('bulkActionBar').style.display = 'none';
            renderRosterGrid();
        }

        function updateBulkBarUI() {
            document.getElementById('bulkCountText').textContent = `${selectedStudentsSet.size} Selected`;
        }

        async function awardClassPoint() {
            if (confirm("Award +1 Point to the ENTIRE class?")) {
                const allNames = students.map(s => s.Name);
                const finalPts = isDouble ? 2 : 1;
                
                sendRealtimeCommand('bulkAddPoints', { students: allNames, points: finalPts });
                
                for(let name of allNames) {
                    const student = students.find(s => s.Name === name);
                    if(student) {
                        await dbClient.from('students').update({ points: student.Points + finalPts }).eq('name', name);
                    }
                }
                
                showToast(`🎉 Whole Class got +${finalPts}!`, true);
                loadData();
            }
        }

        async function submitBulkPoints(amount) {
            if (selectedStudentsSet.size === 0) {
                alert("Please select at least one student first!");
                return;
            }
            const finalPts = isDouble ? amount * 2 : amount;
            const namesArray = Array.from(selectedStudentsSet);

            sendRealtimeCommand('bulkAddPoints', { students: namesArray, points: finalPts });

            for(let name of namesArray) {
                const student = students.find(s => s.Name === name);
                if(student) {
                    await dbClient.from('students').update({ points: student.Points + finalPts }).eq('name', name);
                }
            }

            showToast(`⭐ +${finalPts} awarded to ${namesArray.length} students!`, true);
            clearMultiSelect();
            loadData();
        }

        async function redeemPrize(name) {
            if(confirm(`Redeem prize for ${name}? This will deduct 15 points.`)) {
                sendRealtimeCommand('addPoints', { name: name, points: -15, isDouble: false });
                
                const student = students.find(s => s.Name === name);
                if(student) {
                    await dbClient.from('students').update({ points: student.Points - 15 }).eq('name', name);
                    loadData();
                    revealPrizeVaultLocal(); 
                }
            }
        }

        function toggleScrollRemote() {
            isScrollPaused = !isScrollPaused;
            document.getElementById('btnPauseScrollRemote').innerHTML = isScrollPaused ? '▶️ Play' : '⏸️ Pause';
            sendRealtimeCommand('toggleScroll', { paused: isScrollPaused });
        }

        function populateDatalist() {
            const datalist = document.getElementById('studentDatalist');
            if (!datalist) return;
            datalist.innerHTML = '';
            students.forEach(s => {
                const option = document.createElement('option');
                option.value = s.Name;
                datalist.appendChild(option);
            });
        }

        function handleRemoteSearch(val) {
            if (!val || !val.trim()) return;
            const searchVal = val.trim().toLowerCase();
            const student = students.find(s => s.Name.trim().toLowerCase() === searchVal);
            
            if (student) {
                document.getElementById('remoteSearchInput').value = '';
                activeStudentName = student.Name; 
                sendRealtimeCommand('setActive', { name: student.Name }); 
                showActionPanel(student); 
            } else {
                showToast("⚠️ Student not found.");
            }
        }

        function openPrizeVaultLocal() { 
            document.getElementById('mainAppView').style.display = 'none'; 
            document.getElementById('mobileVaultView').style.display = 'flex'; 
            document.getElementById('vaultLockedState').style.display = 'flex'; 
            document.getElementById('vaultRevealedState').style.display = 'none'; 
        }
        
        function closePrizeVaultLocal() { 
            document.getElementById('mobileVaultView').style.display = 'none'; 
            document.getElementById('mainAppView').style.display = 'block'; 
        }
        
        function revealPrizeVaultLocal() {
            document.getElementById('mainAppView').style.display = 'none'; 
            document.getElementById('mobileVaultView').style.display = 'flex'; 
            document.getElementById('vaultLockedState').style.display = 'none'; 
            document.getElementById('vaultRevealedState').style.display = 'flex';
            
            const list = document.getElementById('mobileWinnerList'); 
            list.innerHTML = '';
            
            const winners = students.filter(s => parseInt(s.Points) >= 15);
            if (winners.length === 0) {
                list.innerHTML = '<p style="color: var(--surface);">No winners yet.</p>';
            }
            
            winners.forEach(w => { 
                const avatar = getSafeAvatar(w.Name, w.AvatarURL);
                const card = document.createElement('div');
                card.className = 'vault-winner-card';
                card.onclick = function() { redeemPrize(w.Name); };
                
                card.innerHTML = `
                    <img src="${avatar}" alt="Winner Avatar"> 
                    <div style="text-align: left;" class="fredoka">
                        ${w.Name}<br>
                        <span style="color: var(--primary);">⭐ ${w.Points}</span>
                    </div>
                `; 
                list.appendChild(card);
            });
        }

        function openPinModal(target) {
            if (target === 'goal') {
                document.getElementById('goalEmojiInput').value = localStorage.getItem('customGoalEmoji') || '🍕';
                document.getElementById('goalNameInput').value = localStorage.getItem('customGoalName') || 'Pizza Party';
                document.getElementById('goalAmountInput').value = localStorage.getItem('customGoalAmount') || 500;
                document.getElementById('goalModal').classList.add('active');
            }
        }

        function saveGoalSettings() {
            const emoji = document.getElementById('goalEmojiInput').value || '🍕';
            const name = document.getElementById('goalNameInput').value || 'Pizza Party';
            const amount = document.getElementById('goalAmountInput').value || 500;
            
            sendRealtimeCommand('updateGoal', { emoji: emoji, name: name, amount: amount });
            document.getElementById('goalModal').classList.remove('active');
            showToast("✅ Goal Beamed!", true);
        }

        function showActionPanel(student) {
            document.getElementById('actionPanel').style.display = 'block';
            document.getElementById('scanAvatar').src = getSafeAvatar(student.Name, student.AvatarURL);
            document.getElementById('scanName').textContent = student.Name;
            document.getElementById('scanPoints').textContent = student.Points;
            
            document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
            selectedTag = "None";
            window.scrollTo(0, document.body.scrollHeight);
        }

        function toggleDouble() {
            isDouble = !isDouble;
            const btn = document.getElementById('doubleBtn');
            btn.className = isDouble ? 'btn-remote double-on' : 'btn-remote';
            btn.innerHTML = isDouble ? '🔥 Disable x2 Points' : '🔥 Enable x2 Points';
            sendRealtimeCommand('toggleDouble', { state: isDouble });
        }

        function toggleTag(btn, tag) {
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            if (selectedTag === tag) { 
                selectedTag = "None"; 
            } else { 
                btn.classList.add('active'); 
                selectedTag = tag; 
            }
        }

        async function updateAvatarColor(hexColor) {
            const hex = hexColor.replace('#', '');
            const safeName = activeStudentName ? encodeURIComponent(activeStudentName.trim()) : 'Student';
            const newUrl = `https://api.dicebear.com/9.x/bottts/svg?seed=${safeName}&backgroundColor=${hex}`;
            document.getElementById('scanAvatar').src = newUrl;
            
            await dbClient.from('students').update({ avatar_url: newUrl }).eq('name', activeStudentName);
            sendRealtimeCommand('refreshData'); 
        }

        async function submitPoints(amount) {
            const finalAmount = isDouble ? amount * 2 : amount;
            const student = students.find(s => s.Name === activeStudentName);
            
            if(!student) return;
            
            undoData = { name: activeStudentName, points: finalAmount, tag: selectedTag };
            showToast(`⭐ +${finalAmount} to ${activeStudentName}`, true);
            
            clearTimeout(undoTimer); 
            undoTimer = setTimeout(() => { 
                const toast = document.getElementById('undoToast');
                if (toast) toast.style.display = 'none'; 
                undoData = null; 
            }, 5000);
            
            // Broadcast for instant UI pop on Dashboard
            sendRealtimeCommand('addPoints', { name: activeStudentName, points: finalAmount, isDouble: isDouble });
            
            // Update Supabase DB directly
            await dbClient.from('students').update({ points: student.Points + finalAmount }).eq('name', activeStudentName);
            
            resetRemote(); 
            loadData();
        }

        async function undoLastPoint() {
            if (!undoData) return;
            
            sendRealtimeCommand('addPoints', { name: undoData.name, points: -undoData.points, isDouble: false });
            
            const student = students.find(s => s.Name === undoData.name);
            if(student) {
                await dbClient.from('students').update({ points: student.Points - undoData.points }).eq('name', undoData.name);
            }
            
            const toast = document.getElementById('undoToast');
            if (toast) toast.style.display = 'none'; 
            undoData = null;
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]); 
            loadData();
        }

        function resetRemote() {
            document.getElementById('actionPanel').style.display = 'none';
            activeStudentName = 'none'; 
            sendRealtimeCommand('setActive', { name: 'none' }); 
        }

        // ==========================================
        // 📥 FETCH DATA FROM SUPABASE
        // ==========================================
        async function loadData() {
            try {
                const { data, error } = await dbClient.from('students').select('*').order('name');
                if (error) throw error;
                
                students = data.map(s => {
                    return { Name: s.name, Points: s.points, Artwork: s.artwork_url, AvatarURL: getSafeAvatar(s.name, s.avatar_url) };
                });
                
                populateDatalist();
                renderRosterGrid();
            } catch(err) {
                console.error("Remote failed to load student data.", err);
                showToast("⚠️ Database connection failed.");
            }
        }
        
        loadData(); 

        // ==========================================
        // 📸 SUPABASE STORAGE IMAGE UPLOAD
        // ==========================================
        async function handleImageUpload(input, type) {
            const file = input.files[0];
            if (!file) return;

            showToast(`⏳ Uploading ${type}...`);

            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                
                // Upload to Supabase 'uploads' bucket
                const { error: uploadError } = await dbClient.storage.from('uploads').upload(fileName, file);
                if (uploadError) throw uploadError;

                // Get Public URL
                const { data: publicUrlData } = dbClient.storage.from('uploads').getPublicUrl(fileName);
                const imageUrl = publicUrlData.publicUrl;
                
                // Update Student Record
                const columnToUpdate = type === 'artwork' ? 'artwork_url' : 'avatar_url';
                const { error: dbError } = await dbClient.from('students').update({ [columnToUpdate]: imageUrl }).eq('name', activeStudentName);
                if (dbError) throw dbError;
                
                showToast(`✅ ${type} saved!`, true);
                if(type === 'avatar') document.getElementById('scanAvatar').src = imageUrl;

                sendRealtimeCommand('refreshData'); 
            } catch (err) {
                console.error("Upload error:", err);
                showToast("❌ Upload failed.");
            }
            input.value = ""; 
        }
    </script>
</body>
</html>
